name: SIPDA CON-001 tests
on:
  push:
    branches:
      - feature/sipda-con-001-agenda
    paths:
      - 'connectors/agenda-municipal/**'
      - '.github/workflows/sipda-con-001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test municipal agenda connector
        run: node --test connectors/agenda-municipal/worker.test.mjs
      - name: Verify syntax
        run: node --check connectors/agenda-municipal/worker.js
